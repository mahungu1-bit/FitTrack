<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitTrack - Log Workout</title>
    <link rel="stylesheet" href="./styles.css">
</head>
<body>

    <header>
        <h2>FitTrack</h2>
        <nav>
            <a href="index.html">Log Session</a>
            <a href="dashboard.html">Dashboard</a>
        </nav>
    </header>

    <div class="card">
        <h1>Log New Workout</h1>
        <div id="successAlert" class="alert">Workout saved successfully!</div>
        
        <form id="workoutForm">
            <div class="form-group">
                <label for="date">Date</label>
                <input type="date" id="date" required>
            </div>

            <div class="form-group">
                <label for="category">Category</label>
                <select id="category" required>
                    <option value="">Select Category</option>
                    <option value="Jiu-Jitsu / Sparring">Jiu-Jitsu / Sparring</option>
                    <option value="Bodyweight & Core">Bodyweight & Core</option>
                    <option value="Dumbbell Training">Dumbbell Training</option>
                    <option value="Cardio / Walking">Cardio / Walking</option>
                </select>
            </div>

            <div class="form-group">
                <label for="duration">Duration (minutes)</label>
                <input type="number" id="duration" placeholder="e.g. 45" min="1" required>
            </div>

            <div class="form-group">
                <label for="notes">Notes & Sets/Reps</label>
                <textarea id="notes" rows="3" placeholder="e.g. 4 rounds rolling, 3x20 push-ups..."></textarea>
            </div>

            <button type="submit">Save Workout</button>
        </form>
    </div>

    <script src="script.js"></script>
</body>
</html>
