<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitTrack - Dashboard</title>
    <link rel="stylesheet" href="./styles.css">
</head>
<body>

    <header>
        <h2>FitTrack</h2>
        <nav>
            <a href="index.html">Log Session</a>
            <a href="dashboard.html">Dashboard</a>
        </nav>
    </header>

    <div class="container">
        <div class="stats-grid">
            <div class="stat-card">
                <p>Total Sessions</p>
                <h3 id="totalSessions">0</h3>
            </div>
            <div class="stat-card">
                <p>Total Minutes</p>
                <h3 id="totalMinutes">0</h3>
            </div>
        </div>

        <div class="card">
            <div class="controls">
                <h3>Workout History</h3>
                <input type="text" id="searchInput" placeholder="Search notes or category..." onkeyup="filterWorkouts()">
            </div>

            <table>
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Category</th>
                        <th>Duration</th>
                        <th>Notes</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="workoutTableBody">
                    <!-- Dynamic rows inserted via JavaScript -->
                </tbody>
            </table>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
